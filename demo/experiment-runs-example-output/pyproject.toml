[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "experiment-runs"
version = "1.0.0"
description = "Single-user HTTP API for logging ML training runs. See specs/001-experiment-runs/spec.md."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "httpx2>=2.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
experiment-runs = "experiment_runs.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/experiment_runs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "perf: latency checks against SC-004 (skip with CI_SKIP_PERF=1)",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
